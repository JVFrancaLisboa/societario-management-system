<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${societario.id == null ? 'Novo Cadastro - IDEA Cont' : 'Editar Processo - IDEA Cont'}"></title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/departments/dp-societario/cadastro.css}">

    <style>
        .required::after { content: " *"; color: red; }
        .form-card { border-top: 5px solid #4CAF50; }
    </style>
</head>
<body>

<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8">

            <div class="header-cadastro mb-4 d-flex align-items-center gap-3">
                <a th:href="@{/societario/dash}" class="btn btn-outline-secondary shadow-sm">
                    <i class="bi bi-arrow-left"></i> Voltar ao Dashboard
                </a>
                <h2 class="m-0 text-dark fw-bold" 
                    th:text="${societario.id == null ? 'Cadastro de Novo Processo' : 'Edição de Processo #' + societario.id}"></h2>
            </div>
            
            <div class="form-card shadow-sm p-4 bg-white rounded">
                <form th:action="@{/societario/cadastro}" th:object="${societario}" method="post" novalidate>
                    
                    <input type="hidden" th:field="*{id}">

                    <div class="row mb-3">
                        <div class="col-md-7">
                            <label for="processoName" class="form-label required">Processo</label>
                            <input id="processoName" th:field="*{nomeProcesso}" type="text" 
                                   class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nomeProcesso')}" th:errors="*{nomeProcesso}"></div>
                        </div>
                        <div class="col-md-5">
                            <label for="cnpjCpf" class="form-label required">CNPJ/CPF</label>
                            <input id="cnpjCpf" th:field="*{cnpjCpf}" type="text" 
                                   class="form-control" th:errorclass="is-invalid" placeholder="000.000.000-00">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('cnpjCpf')}" th:errors="*{cnpjCpf}"></div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="tipo" class="form-label required">Tipo</label>
                            <select id="tipo" th:field="*{tipo}" class="form-select" th:errorclass="is-invalid">
                                <option value="">Selecione</option>
                                <option th:each="tipoOpt : ${T(com.ideasystem.entities.enums.societario.TipoProcesso).values()}" 
                                        th:value="${tipoOpt}" th:text="${tipoOpt.descricao}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{tipo}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="fase" class="form-label required">Fase</label>
                            <select id="fase" th:field="*{fase}" class="form-select" th:errorclass="is-invalid">
                                <option value="">Selecione</option>
                                <option th:each="faseOpt : ${T(com.ideasystem.entities.enums.societario.FaseProcesso).values()}" 
                                        th:value="${faseOpt}" th:text="${faseOpt.descricao}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{fase}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="statusTaxa" class="form-label required">Taxa</label>
                            <select id="statusTaxa" th:field="*{statusTaxa}" class="form-select" th:errorclass="is-invalid">
                                <option value="">Selecione</option>
                                <option th:each="taxaOpt : ${T(com.ideasystem.entities.enums.societario.StatusTaxa).values()}" 
                                        th:value="${taxaOpt}" th:text="${taxaOpt.descricao}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{statusTaxa}"></div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="contatoResponsavel" class="form-label required">Contato</label>
                            <input id="contatoResponsavel" th:field="*{contatoResponsavel}" type="text" 
                                   class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{contatoResponsavel}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="valorHonorario" class="form-label required">Honorário</label>
                            <select id="valorHonorario" th:field="*{valorHonorario}" class="form-select" th:errorclass="is-invalid">
                                <option value="">Selecione</option>
                                <option th:each="honOpt : ${T(com.ideasystem.entities.enums.societario.Honorario).values()}" 
                                        th:value="${honOpt}" th:text="${honOpt.descricao}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{valorHonorario}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="valorTotal" class="form-label required">Valor</label>
                            <input id="valorTotal" th:field="*{valorTotal}" type="text" 
                                   class="form-control" th:errorclass="is-invalid" placeholder="0,00">
                            <div class="invalid-feedback" th:errors="*{valorTotal}"></div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label for="celular" class="form-label required">Celular</label>
                            <input id="celular" th:field="*{celular}" type="text" 
                                   class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{celular}"></div>
                        </div>
                        <div class="col-md-8">
                            <label for="email" class="form-label required">E-mail</label>
                            <input id="email" th:field="*{email}" type="email" 
                                   class="form-control" th:errorclass="is-invalid">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="dataCriacao" class="form-label fw-bold">Data do Processo (Opcional)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-calendar-event"></i></span>
                                <input type="date" th:field="*{dataCriacao}" class="form-control" id="dataCriacao">
                            </div>
                            <div class="form-text">Deixe em branco para usar a data de hoje.</div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end mt-4 gap-2">
                        <button id="btn-salvar" type="submit" 
                                th:class="${societario.id == null ? 'btn btn-success px-4 fw-bold' : 'btn btn-primary px-4 fw-bold'}">
                            <i th:class="${societario.id == null ? 'bi bi-plus-circle me-1' : 'bi bi-check-circle me-1'}"></i>
                            <span th:text="${societario.id == null ? 'Salvar Cadastro' : 'Salvar Alterações'}"></span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/cpf-cnpj-validator@1.0.3/dist/cpf-cnpj-validator.js"></script>
<script th:src="@{/js/departments/dp-societario/cadastro.js}"></script>

</body>
</html>
