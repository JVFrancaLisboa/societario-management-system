<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
      defer
    ></script>

    <!-- Sidebar CSS -->
    <link rel="stylesheet" th:href="@{/css/sidebar.css}" />
  </head>

  <body>
    <!-- Sidebar -->
    <div th:replace="screens/sidebar :: sidebar"></div>

    <!-- Content -->
    <div class="container mt-4">
      <h4 class="mb-4">Dados da Empresa</h4>
      <form class="row g-3">
        <!-- Razão Social -->
        <div class="col-md-6">
          <label class="form-label">Razão Social</label>
          <input type="text" class="form-control" value="IDEACONT SOLUCOES CORPORATIVAS LTDA" />
        </div>

        <!-- CNPJ/CPF -->
        <div class="col-md-3">
          <label class="form-label">CNPJ/CPF</label>
          <input type="text" class="form-control" value="33.776.814/0001-71"  />
        </div>

        <!-- Inscrição Estadual -->
        <div class="col-md-3">
          <label class="form-label">Inscrição Estadual</label>
          <input type="text" class="form-control" value="07.918.791/001-90"  />
        </div>

        <!-- Inscrição Municipal -->
        <div class="col-md-3">
          <label class="form-label">Inscrição Municipal</label>
          <input type="text" class="form-control" value="07.918.791/001-90"  />
        </div>

        <!-- Tributação -->
        <div class="col-md-3">
          <label class="form-label">Tributação</label>
          <input type="text" class="form-control" value="IMUNE E ISENTA"  />
        </div>

        <!-- Tipo -->
        <div class="col-md-3">
          <label class="form-label">Tipo</label>
          <input type="text" class="form-control" value="IMUNE E ISENTA"  />
        </div>

        <!-- Atividade Econômica -->
        <div class="col-md-3">
          <label class="form-label">Atividade Econômica</label>
          <input type="text" class="form-control" value="SER/COMERCIO"  />
        </div>

        <!-- CEP -->
        <div class="col-md-3">
          <label class="form-label">CEP</label>
          <input type="text" class="form-control" value="72.240-820"  />
        </div>

        <!-- Logradouro -->
        <div class="col-md-6">
          <label class="form-label">Logradouro</label>
          <input type="text" class="form-control" value="QNP 9 Conjunto T"  />
        </div>

        <!-- Número -->
        <div class="col-md-2">
          <label class="form-label">Número</label>
          <input type="text" class="form-control" value="40"  />
        </div>

        <!-- Complemento -->
        <div class="col-md-4">
          <label class="form-label">Complemento</label>
          <input type="text" class="form-control" value="Casa"  />
        </div>

        <!-- Bairro -->
        <div class="col-md-4">
          <label class="form-label">Bairro</label>
          <input type="text" class="form-control" value="Ceilândia Norte"  />
        </div>

        <!-- Cidade -->
        <div class="col-md-3">
          <label class="form-label">Cidade</label>
          <input type="text" class="form-control" value="Brasília"  />
        </div>

        <!-- UF -->
        <div class="col-md-1">
          <label class="form-label">UF</label>
          <input type="text" class="form-control" value="DF"  />
        </div>

        <hr class="mt-4" />

        <h5 class="mt-4">Dados do Sócio</h5>

        <!-- Responsável -->
        <div class="col-md-6">
          <label class="form-label">Responsável</label>
          <input type="text" class="form-control" value="Davi Pereira dos Santos"  />
        </div>

        <!-- CPF -->
        <div class="col-md-3">
          <label class="form-label">CPF</label>
          <input type="text" class="form-control" value="019.394.051-57"  />
        </div>

        <!-- RG/CNH -->
        <div class="col-md-3">
          <label class="form-label">RG/CNH</label>
          <input type="text" class="form-control" value="2.588.277"  />
        </div>

        <!-- Órgão Emissor -->
        <div class="col-md-2">
          <label class="form-label">Órgão Emissor</label>
          <input type="text" class="form-control" value="SSP"  />
        </div>

        <!-- UF Emissor -->
        <div class="col-md-1">
          <label class="form-label">UF</label>
          <input type="text" class="form-control" value="DF"  />
        </div>

        <!-- Telefone -->
        <div class="col-md-3">
          <label class="form-label">Telefone</label>
          <input type="text" class="form-control" value="(61) 3550-5830"  />
        </div>

        <!-- Celular -->
        <div class="col-md-3">
          <label class="form-label">Celular</label>
          <input type="text" class="form-control" value="(61) 9 8168-3940"  />
        </div>

        <!-- E-mail -->
        <div class="col-md-6">
          <label class="form-label">E-mail</label>
          <input type="email" class="form-control" value="davi.santos@ideacont.com.br"  />
        </div>

        <hr class="mt-4" />

        <!-- Status da Empresa, Cobrança, Contrato, Responsabilidades -->
        <div class="col-md-3">
          <label class="form-label">Status da Empresa</label>
          <input type="text" class="form-control bg-success text-white" value="ATIVA"  />
        </div>

        <div class="col-md-3">
          <label class="form-label">Cobrança</label>
          <input type="text" class="form-control bg-success text-white" value="Cobrança"  />
        </div>

        <div class="col-md-3">
          <label class="form-label">Valor do Honorário</label>
          <input type="text" class="form-control" value="R$ 10.000,00"  />
        </div>

        <div class="col-md-3">
          <label class="form-label">Vencimento</label>
          <input type="text" class="form-control" value="15"  />
        </div>

        <div class="col-md-3">
          <label class="form-label">Contrato</label>
          <input type="text" class="form-control bg-danger text-white" value="SEM CONTRATO"  />
        </div>

        <div class="col-md-3">
          <label class="form-label">Responsabilidades</label>
          <input type="text" class="form-control bg-success text-white" value="Responsabilidade"  />
        </div>

        <div class="col-md-6">
          <label class="form-label">Serviços Ativos</label>
          <div class="d-flex flex-wrap gap-2">
            <span class="badge bg-primary">Contábil: SIM</span>
            <span class="badge bg-primary">Fiscal: SIM</span>
            <span class="badge bg-primary">Folha: SIM</span>
            <span class="badge bg-primary">Financeiro: SIM</span>
          </div>
        </div>

        <!-- Data do contrato -->
        <div class="col-md-3">
          <label class="form-label">Data do Contrato</label>
          <input type="text" class="form-control bg-success text-white" value="01/06/2019"  />
        </div>

        <!-- Observações -->
        <div class="col-md-9">
          <label class="form-label">Observações</label>
          <textarea class="form-control" rows="2" ></textarea>
        </div>

        <div class="col-12 text-end">
          <button type="submit" class="btn btn-success">Salvar</button>
        </div>
      </form>
    </div>
  </body>
</html>
