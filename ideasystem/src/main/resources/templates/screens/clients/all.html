<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Todos os Clientes</title>

  <!-- CSS Bootstrap 5 CDN -->
  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous"
  />
  <!-- JS Bootstrap 5 CDN -->
  <script
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
          crossorigin="anonymous"
          defer
  ></script>
</head>
<body>
<div class="container mt-4">
  <h4 class="mb-4">Todos os Clientes</h4>
  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-success">
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Razão Social</th>
        <th scope="col">CNPJ/CPF</th>
        <th scope="col">IE</th>
        <th scope="col">IM</th>
        <th scope="col">Tributação</th>
        <th scope="col">Tipo</th>
        <th scope="col">Atividade</th>
        <th scope="col">Status</th>
        <th scope="col">CEP</th>
        <th scope="col">Logradouro</th>
        <th scope="col">Número</th>
        <th scope="col" class="d-none d-md-table-cell">Complemento</th>
        <th scope="col">Bairro</th>
        <th scope="col">Cidade</th>
        <th scope="col">UF</th>
        <th scope="col">Responsável</th>
        <th scope="col">CPF</th>
        <th scope="col" class="d-none d-md-table-cell">RG/CNH</th>
        <th scope="col" class="d-none d-md-table-cell">Org. Emissor</th>
        <th scope="col" class="d-none d-md-table-cell">UF Doc</th>
        <th scope="col">Tel</th>
        <th scope="col" class="d-none d-md-table-cell">Cel</th>
        <th scope="col">E-mail</th>
        <th scope="col">Honorário</th>
        <th scope="col">Vencimento</th>
        <th scope="col">Contrato</th>
        <th scope="col">Data Contrato</th>
        <th scope="col" class="d-none d-md-table-cell">Contábil</th>
        <th scope="col" class="d-none d-md-table-cell">Fiscal</th>
        <th scope="col" class="d-none d-md-table-cell">Folha</th>
        <th scope="col" class="d-none d-md-table-cell">Financeiro</th>
        <th scope="col">Obs.</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="client : ${clients}">
        <td th:text="${client.id}"></td>
        <td th:text="${client.razaoSocial}"></td>
        <td th:text="${client.cnpjCpf}"></td>
        <td th:text="${client.inscricaoEstadual}"></td>
        <td th:text="${client.inscricaoMunicipal}"></td>
        <td th:text="${client.tributacao}"></td>
        <td th:text="${client.tipo}"></td>
        <td th:text="${client.atividadeEconomica}"></td>
        <td th:text="${client.statusEmpresa}"></td>
        <td th:text="${client.cep}"></td>
        <td th:text="${client.logradouro}"></td>
        <td th:text="${client.numero}"></td>
        <td class="d-none d-md-table-cell" th:text="${client.complemento}"></td>
        <td th:text="${client.bairro}"></td>
        <td th:text="${client.cidade}"></td>
        <td th:text="${client.uf}"></td>
        <td th:text="${client.responsavel}"></td>
        <td th:text="${client.cpf}"></td>
        <td class="d-none d-md-table-cell" th:text="${client.rgCnh}"></td>
        <td class="d-none d-md-table-cell" th:text="${client.orgaoEmissor}"></td>
        <td class="d-none d-md-table-cell" th:text="${client.ufDocumento}"></td>
        <td th:text="${client.telefone}"></td>
        <td class="d-none d-md-table-cell" th:text="${client.celular}"></td>
        <td th:text="${client.email}"></td>
        <td th:text="${#numbers.formatDecimal(client.valorHonorario, 2, 'COMMA', 2, 'POINT')}"></td>
        <td th:text="${client.vencimento}"></td>
        <td th:text="${client.contrato}"></td>
        <td th:text="${#temporals.format(client.dataContrato, 'dd/MM/yyyy')}"></td>
        <td class="d-none d-md-table-cell" th:text="${client.contabilidade}"></td>
        <td class="d-none d-md-table-cell" th:text="${client.fiscal}"></td>
        <td class="d-none d-md-table-cell" th:text="${client.folha}"></td>
        <td class="d-none d-md-table-cell" th:text="${client.financeiro}"></td>
        <td th:text="${client.observacoes}"></td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
