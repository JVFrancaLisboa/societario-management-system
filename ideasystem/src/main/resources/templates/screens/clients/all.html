<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Financeiro - Clientes</title>

  <!-- CSS Bootstrap 5 CDN -->
  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous"
  />
  <!-- JS Bootstrap 5 CDN -->
  <script
          src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
          crossorigin="anonymous"
          defer
  ></script>

  <!-- Estilos personalizados para o layout compacto -->
  <style>
    body {
      background-color: #f8f9fa;
    }
    .table-compact {
      font-size: 0.8rem; /* Fonte menor para mais densidade */
    }
    .table-header-green {
      background-color: #4caf50; /* Verde similar ao do Excel */
      color: white;
      text-transform: uppercase;
      font-weight: bold;
    }
    .status-assinado {
      background-color: #d4edda; /* Verde claro */
      color: #155724;
      font-weight: bold;
    }
    .status-nao {
      background-color: #f8d7da; /* Vermelho claro */
      color: #721c24;
      font-weight: bold;
    }
    .table-compact th,
    .table-compact td {
      padding: 0.3rem 0.5rem; /* Espaçamento interno reduzido */
      white-space: nowrap; /* Evita quebra de linha */
    }
    .razao-social-col {
      white-space: normal; /* Permite quebra de linha na razão social */
      min-width: 250px; /* Largura mínima para melhor leitura */
      text-align: left !important;
    }
  </style>
</head>
<body>
<div class="container-fluid my-3">
  <!-- Opcional: Adicionar o cabeçalho "FINANCEIRO" se desejar -->
  <!--
  <div class="text-white p-3 mb-3 rounded" style="background-color: #4CAF50;">
      <h2 class="display-6 m-0">FINANCEIRO</h2>
  </div>
  -->
  <div class="table-responsive">
    <table class="table table-sm table-bordered table-hover table-compact w-100 text-center align-middle">
      <thead class="table-header-green">
      <tr>
        <th scope="col">CTR</th>
        <th scope="col">Nº</th>
        <th scope="col" class="text-start">Razão Social</th>
        <th scope="col">Financeiro</th>
        <th scope="col">Honorário</th>
        <th scope="col">Venc.</th>
        <th scope="col">Contrato</th>
        <th scope="col">Contato</th>
        <th scope="col">Celular</th>
        <th scope="col">E-mail</th>
      </tr>
      </thead>
      <tbody>
      <!-- Loop do Thymeleaf para renderizar os dados dos clientes -->
      <tr th:each="client, iterStat : ${clients}">
        <td th:text="${client.id}">0001</td>
        <td th:text="${iterStat.count}">0011</td>
        <td class="razao-social-col" th:text="${client.razaoSocial}">RAZÃO SOCIAL DO CLIENTE</td>

        <!-- Lógica condicional para o status Financeiro -->
        <td th:switch="${client.financeiro}">
          <span th:case="'NÃO'" class="badge bg-danger rounded-pill px-3">NÃO</span>
          <span th:case="*" class="badge bg-success rounded-pill px-3" th:text="${client.financeiro}"></span>
        </td>

        <td th:text="'R$ ' + ${#numbers.formatDecimal(client.valorHonorario, 1, 'POINT', 2, 'COMMA' )}">R$ 535,00</td>
        <td th:text="${client.vencimento}">05</td>

        <!-- Lógica condicional para o status do Contrato -->
        <td th:switch="${client.contrato}">
          <span th:case="'ASSINADO'" class="badge status-assinado">ASSINADO</span>
          <span th:case="*" class="badge bg-warning text-dark" th:text="${client.contrato}">PENDENTE</span>
        </td>

        <td th:text="${client.responsavel}">THOMAS</td>
        <td th:text="${client.celular}">(61) 9 8155-9956</td>
        <td th:text="${client.email}">email@example.com</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
