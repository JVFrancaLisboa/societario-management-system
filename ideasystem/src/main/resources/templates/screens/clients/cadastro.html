<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Empresa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-section {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section-title {
            color: #495057;
            font-weight: 600;
            margin-bottom: 15px;
            border-bottom: 2px solid #dee2e6;
            padding-bottom: 8px;
        }
    </style>
</head>
<body>
<!-- Sidebar -->
<div th:replace="~{screens/sidebar :: sidebar}"></div>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2 class="text-center mb-4">Cadastro de Empresa</h2>
                
                <form>
                    <!-- Dados da Empresa -->
                    <div class="form-section">
                        <h4 class="section-title">Dados da Empresa</h4>
                        
                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label for="razaoSocial" class="form-label">Razão Social:</label>
                                <input type="text" class="form-control" id="razaoSocial" name="razaoSocial">
                            </div>
                            <div class="col-md-4">
                                <label for="cnpjCpf" class="form-label">CNPJ/CPF:</label>
                                <input type="text" class="form-control" id="cnpjCpf" name="cnpjCpf">
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="inscricaoEstadual" class="form-label">Inscrição Estadual:</label>
                                <input type="text" class="form-control" id="inscricaoEstadual" name="inscricaoEstadual">
                            </div>
                            <div class="col-md-4">
                                <label for="inscricaoMunicipal" class="form-label">Inscrição Municipal:</label>
                                <input type="text" class="form-control" id="inscricaoMunicipal" name="inscricaoMunicipal">
                            </div>
                            <div class="col-md-4">
                                <label for="tributacao" class="form-label">Tributação:</label>
                                <select class="form-control" id="tributacao" name="tributacao">
                                    <option value="">Selecione...</option>
                                    <option value="MEI">MEI</option>
                                    <option value="IMUNE E ISENTA">IMUNE E ISENTA</option>
                                    <option value="SIMPLES">SIMPLES</option>
                                    <option value="PRESUMIDO">PRESUMIDO</option>
                                    <option value="REAL">REAL</option>
                                    <option value="CONDOMÍNIO">CONDOMÍNIO</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="tipo" class="form-label">Tipo:</label>
                                <select class="form-control" id="tipo" name="tipo">
                                    <option value="">Selecione...</option>
                                    <option value="GERAL">GERAL</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="atividadeEconomica" class="form-label">Atividade Econômica:</label>
                                <select class="form-control" id="atividadeEconomica" name="atividadeEconomica">
                                    <option value="">Selecione...</option>
                                    <option value="COMÉRCIO">COMÉRCIO</option>
                                    <option value="SERVIÇOS">SERVIÇOS</option>
                                    <option value="SER/COMERCIO">SER/COMERCIO</option>
                                    <option value="3º SETOR">3º SETOR</option>
                                    <option value="INDUSTRIA">INDUSTRIA</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="situacao" class="form-label">Situação:</label>
                                <select class="form-control" id="situacao" name="situacao">
                                    <option value="">Selecione...</option>
                                    <option value="ATIVA">ATIVA</option>
                                    <option value="INATIVA">INATIVA</option>
                                    <option value="SUSPENSA">SUSPENSA</option>
                                    <option value="EVENTUAL">EVENTUAL</option>
                                    <option value="BAIXADA">BAIXADA</option>
                                    <option value="TRANSFERIDA">TRANSFERIDA</option>
                                    <option value="PARALISADA">PARALISADA</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Endereço -->
                    <div class="form-section">
                        <h4 class="section-title">Endereço</h4>
                        
                        <div class="row mb-3">
                            <div class="col-md-3">
                                <label for="cep" class="form-label">CEP:</label>
                                <input type="text" class="form-control" id="cep" name="cep">
                            </div>
                            <div class="col-md-6">
                                <label for="logradouro" class="form-label">Logradouro:</label>
                                <input type="text" class="form-control" id="logradouro" name="logradouro">
                            </div>
                            <div class="col-md-3">
                                <label for="numero" class="form-label">Nº.:</label>
                                <input type="text" class="form-control" id="numero" name="numero">
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="complemento" class="form-label">Complemento:</label>
                                <input type="text" class="form-control" id="complemento" name="complemento">
                            </div>
                            <div class="col-md-4">
                                <label for="bairro" class="form-label">Bairro:</label>
                                <input type="text" class="form-control" id="bairro" name="bairro">
                            </div>
                            <div class="col-md-3">
                                <label for="cidade" class="form-label">Cidade:</label>
                                <input type="text" class="form-control" id="cidade" name="cidade">
                            </div>
                            <div class="col-md-1">
                                <label for="uf" class="form-label">UF:</label>
                                <input type="text" class="form-control" id="uf" name="uf" maxlength="2">
                            </div>
                        </div>
                    </div>

                    <!-- Dados do Sócio -->
                    <div class="form-section">
                        <h4 class="section-title">Dados do Sócio</h4>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="responsavel" class="form-label">Responsável:</label>
                                <input type="text" class="form-control" id="responsavel" name="responsavel">
                            </div>
                            <div class="col-md-3">
                                <label for="cpf" class="form-label">CPF:</label>
                                <input type="text" class="form-control" id="cpf" name="cpf">
                            </div>
                            <div class="col-md-3">
                                <label for="rgCnh" class="form-label">RG/CNH:</label>
                                <input type="text" class="form-control" id="rgCnh" name="rgCnh">
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-3">
                                <label for="orgaoEmissor" class="form-label">Órgão Emissor:</label>
                                <input type="text" class="form-control" id="orgaoEmissor" name="orgaoEmissor">
                            </div>
                            <div class="col-md-3">
                                <label for="telefone" class="form-label">Telefone:</label>
                                <input type="text" class="form-control" id="telefone" name="telefone">
                            </div>
                            <div class="col-md-3">
                                <label for="celular" class="form-label">Celular:</label>
                                <input type="text" class="form-control" id="celular" name="celular">
                            </div>
                            <div class="col-md-3">
                                <label for="email" class="form-label">E-mail:</label>
                                <input type="email" class="form-control" id="email" name="email">
                            </div>
                        </div>
                    </div>

                    <!-- Serviços Contratados -->
                    <div class="form-section">
                        <h4 class="section-title">Serviços Contratados</h4>
                        
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <label class="form-label">Serviços:</label>
                                <div class="row">
                                    <div class="col-md-2">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="contrato" name="contrato">
                                            <label class="form-check-label" for="contrato">Contrato</label>
                                        </div>
                                    </div>
                                    <div class="col-md-2">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="contabilidade" name="contabilidade">
                                            <label class="form-check-label" for="contabilidade">Contabilidade</label>
                                        </div>
                                    </div>
                                    <div class="col-md-2">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="fiscal" name="fiscal">
                                            <label class="form-check-label" for="fiscal">Fiscal</label>
                                        </div>
                                    </div>
                                    <div class="col-md-2">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="folha" name="folha">
                                            <label class="form-check-label" for="folha">Folha</label>
                                        </div>
                                    </div>
                                    <div class="col-md-2">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" id="financeiro" name="financeiro">
                                            <label class="form-check-label" for="financeiro">Financeiro</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="responsabilidade" class="form-label">Responsabilidade:</label>
                                <select class="form-control" id="responsabilidade" name="responsabilidade">
                                    <option value="">Selecione...</option>
                                    <option value="SIM">SIM</option>
                                    <option value="NÃO">NÃO</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="dataContrato" class="form-label">Data do Contrato:</label>
                                <input type="date" class="form-control" id="dataContrato" name="dataContrato">
                            </div>
                            <div class="col-md-4">
                                <label for="statusContrato" class="form-label">Status do Contrato:</label>
                                <select class="form-control" id="statusContrato" name="statusContrato">
                                    <option value="">Selecione...</option>
                                    <option value="ASSINADO">ASSINADO</option>
                                    <option value="PENDENTE">PENDENTE</option>
                                    <option value="SEM CONTRATO">SEM CONTRATO</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Cobrança -->
                    <div class="form-section">
                        <h4 class="section-title">Cobrança</h4>
                        
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="valorHonorario" class="form-label">Valor do Honorário:</label>
                                <div class="input-group">
                                    <span class="input-group-text">R$</span>
                                    <input type="number" class="form-control" id="valorHonorario" name="valorHonorario" step="0.01">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <label for="vencimento" class="form-label">Vencimento:</label>
                                <input type="date" class="form-control" id="vencimento" name="vencimento">
                            </div>
                        </div>
                    </div>

                    <!-- Observações -->
                    <div class="form-section">
                        <h4 class="section-title">Observações</h4>
                        
                        <div class="row mb-3">
                            <div class="col-md-12">
                                <label for="observacoes" class="form-label">Observações:</label>
                                <textarea class="form-control" id="observacoes" name="observacoes" rows="4"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Botão Salvar -->
                    <div class="row">
                        <div class="col-12 text-end">
                            <button type="submit" class="btn btn-primary btn-lg">Salvar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
