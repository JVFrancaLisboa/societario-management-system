<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de certificados</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Sidebar -->
    <div th:replace="~{screens/sidebar :: sidebar}"></div>

    <div class="container mt-4">
      <div class="row">
        <div class="col-12">
          <h2 class="text-center mb-4">Cadastro de Certificados</h2>
          <div class="col-md-4">
            <h4 class="text-center mb-4">Essa empresa possui um cadastro?</h4>
            <label for="tributacao" class="form-label text-center mb-4"
              >Empresas cadastradas:</label
            >
            <select
              th:field="${certificado.razaoSocial}"
              class="form-control"
              id="client-id"
            >
              <option value="">Selecione...</option>
              <option
                th:each="c : ${clients}"
                th:value="${c.id}"
                th:text="${c.razaoSocial}"
              ></option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
